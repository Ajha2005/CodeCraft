# =============================================================================
# OPTIONAL: restore the real visitor IP when the API hostname is proxied by
# Cloudflare.
#
# Install as /etc/nginx/snippets/cloudflare-realip.conf and enable it by
# uncommenting the include line in the HTTPS server block of codecraft-api.conf.
# (It is NOT placed in conf.d/ on purpose: files there are loaded automatically.)
#
# WHEN TO INCLUDE IT
#  - ONLY when this API hostname is proxied by Cloudflare (orange cloud). Then
#    every request reaches nginx from a Cloudflare edge address, and without
#    this file the per-IP rate limits would all count against Cloudflare's
#    addresses and the backend would see Cloudflare as the client.
#  - Do NOT include it when clients connect to the server directly: it would do
#    nothing useful, and any range in the list below that is not really
#    Cloudflare's (a stale list) would be trusted to claim any client IP by
#    sending a CF-Connecting-IP header, which is a way to spoof an address.
#  - Also close the EC2 security group on 80 and 443 to Cloudflare's ranges, or
#    anyone can reach the server directly and skip Cloudflare's protection.
#
# HOW IT WORKS
#  nginx replaces $remote_addr with the CF-Connecting-IP header, but only for
#  requests whose TCP peer is inside one of the set_real_ip_from ranges. The
#  X-Forwarded-For header that codecraft-api.conf sends to the backend is built
#  from $remote_addr, so it carries the real visitor too.
#
# REFRESH THE LIST BEFORE USE
#  Cloudflare changes these ranges now and then. The list below was written from
#  memory of Cloudflare's published ranges and was NOT checked against the live
#  page (the sandbox this was authored in could not reach cloudflare.com).
#  Regenerate it from https://www.cloudflare.com/ips/ (the lists are also at
#  /ips-v4 and /ips-v6 on that host):
#    ( curl -fsS https://www.cloudflare.com/ips-v4; echo; \
#      curl -fsS https://www.cloudflare.com/ips-v6; echo ) \
#      | sed '/^$/d; s/.*/set_real_ip_from &;/'
#  and replace the set_real_ip_from lines below with the output. Re-check every
#  few months, then `nginx -t && systemctl reload nginx`.
# =============================================================================

# IPv4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# IPv6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# The header Cloudflare sets to the connecting visitor's address.
real_ip_header CF-Connecting-IP;
# Harmless for a single-valued header like this one; keeps the behaviour
# correct if the header is ever switched to X-Forwarded-For.
real_ip_recursive on;
