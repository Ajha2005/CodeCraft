# =============================================================================
# CodeCraft API: temporary port-80 site, used ONLY to get the first Let's Encrypt
# certificate. The real site (codecraft-api.conf) refuses to load until the
# certificate files exist, so on a new box this one runs first. RUNBOOK.md,
# section 1.5.
#
# Install as /etc/nginx/sites-available/codecraft-bootstrap.conf with
# api.example.com replaced, enable it, run
#   certbot certonly --webroot -w /var/www/certbot -d api.yourdomain.com
# then delete its link from sites-enabled/ and enable codecraft-api.conf instead.
# Never leave both enabled: they would both claim port 80 for the same name.
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # Let's Encrypt HTTP-01 challenge files written by `certbot --webroot`.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
