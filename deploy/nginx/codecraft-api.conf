# =============================================================================
# CodeCraft API: nginx server blocks (public face of the NestJS backend).
#
# Install as /etc/nginx/sites-available/codecraft-api.conf and enable with
#   ln -s /etc/nginx/sites-available/codecraft-api.conf /etc/nginx/sites-enabled/
# It needs 00-codecraft-http.conf in /etc/nginx/conf.d/ (rate-limit zones, WebSocket map,
# TLS session cache, gzip tuning).
#
# Traffic path:  browser -> [optional Cloudflare] -> this nginx -> Node on 127.0.0.1:3000
# The backend listens on loopback only and uses `trust proxy` = 1, so it takes
# the client IP from the LAST X-Forwarded-For entry, the one this nginx wrote.
#
# Before enabling:
#  1. CHANGE api.example.com TO THE REAL API HOSTNAME. It is a placeholder. It
#     appears four times below (two server_name lines, two certificate paths),
#     each marked "CHANGE". For example:
#       sed -i 's/api\.example\.com/api.yourdomain.com/g' codecraft-api.conf
#  2. Remove Ubuntu's stock site: rm /etc/nginx/sites-enabled/default
#     It declares its own default_server on port 80, and two defaults on one
#     port make `nginx -t` fail.
#  3. mkdir -p /var/www/certbot   (webroot for the ACME challenge below)
#  4. First certificate: the HTTPS block cannot load before its certificate
#     exists, so nginx -t fails on a new box. Start with the temporary port-80
#     site deploy/nginx/bootstrap-http.conf (RUNBOOK.md, section 1.5), issue the
#     certificate with
#       certbot certonly --webroot -w /var/www/certbot -d api.example.com
#     then switch to this file. It needs nothing from certbot except the
#     certificate and its key: the TLS settings are written out below, because
#     certbot's own options-ssl-nginx.conf and ssl-dhparams.pem are installed by
#     its nginx plugin (`certbot --nginx`), not by `certonly`.
#     Renewal only helps if nginx is reloaded afterwards: add a deploy hook
#     (/etc/letsencrypt/renewal-hooks/deploy/) that runs `systemctl reload nginx`.
#  5. nginx 1.24 (Ubuntu 24.04) takes `http2` on the listen line, as below. From
#     1.25.1 that form is deprecated in favour of a separate `http2 on;`.
# =============================================================================

# ----- (a) Catch-all: unknown Host / SNI gets nothing -------------------------
# Requests that name any host other than api.example.com (scanners hitting the
# bare IP, stale DNS records, Host-header tricks) land here by default.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # nginx-specific code: close the connection without sending any response.
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # Abort the TLS handshake itself when the SNI is unknown or missing. This
    # needs no certificate here and does not reveal which names this server
    # serves (nginx 1.19.4+).
    ssl_reject_handshake on;
    # The default server's protocol list applies to every handshake on this port
    # (nginx reads it before it knows the name), so it is set here as well as below.
    ssl_protocols TLSv1.2 TLSv1.3;
}

# ----- (b) api.example.com on port 80: ACME challenge, otherwise HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    # CHANGE: api.example.com is a placeholder, put the real API hostname here.
    server_name api.example.com;

    # Let's Encrypt HTTP-01 challenge files written by `certbot --webroot`.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ----- (c) api.example.com on 443: TLS termination and reverse proxy ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    # CHANGE: api.example.com is a placeholder, put the real API hostname here
    # and in the two certificate paths below (certbot names the folder after it).
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;  # CHANGE the hostname
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;    # CHANGE the hostname

    # TLS settings: Mozilla's "intermediate" profile, the same as certbot's
    # options-ssl-nginx.conf except that the two DHE suites are left out, so no
    # ssl_dhparam file is needed. They are written out here, not included from
    # /etc/letsencrypt, because `certbot certonly` does not create that file.
    # (The session cache part of that profile is in 00-codecraft-http.conf.)
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    # ONLY when this hostname is proxied by Cloudflare (orange cloud); then
    # uncomment. It makes $remote_addr the real visitor instead of Cloudflare's
    # edge, which the rate limits and X-Forwarded-For below depend on. Read the
    # header of that file first. Use Cloudflare's "Full (strict)" SSL mode, not
    # "Flexible": Flexible talks plain HTTP to port 80 and loops on the redirect.
    # include /etc/nginx/snippets/cloudflare-realip.conf;

    # Slowloris-style clients: do not let them hold a connection open for minutes.
    client_header_timeout 15s;
    client_body_timeout   15s;
    send_timeout          30s;
    keepalive_timeout     30s;

    # Logging is nginx's default access log: path, query string, status, size.
    # It never records a request body or an Authorization header, so no token
    # reaches the disk. The app puts no token in a URL (Socket.IO sends it in the
    # handshake body); the one secret that appears in a URL is Google's single-use
    # sign-in code on /auth/google/callback.

    # The API only takes small JSON (the backend caps bodies at 64 kB), so
    # stop anything bigger here, before it reaches Node.
    client_max_body_size 128k;

    # Gzip is switched on here, not in 00-codecraft-http.conf, because Ubuntu's
    # nginx.conf already enables it at http level and a repeat there is an
    # error. The tuning (types, level, minimum size) is in that file.
    gzip on;

    # ----- Proxy defaults (inherited by locations that set no proxy_set_header) --
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # X-Forwarded-For is OVERWRITTEN with $remote_addr on purpose, not appended
    # to (`$proxy_add_x_forwarded_for` would keep whatever the client sent). The
    # backend trusts exactly ONE hop and reads the last entry, so a client that
    # sends "X-Forwarded-For: 1.2.3.4" must not be able to pick its own address
    # and dodge the per-IP throttling. With this line the backend always sees a
    # single value: the address that connected to nginx (or, behind Cloudflare
    # with cloudflare-realip.conf, the real visitor).
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Empty Connection: keep the upstream request a plain HTTP/1.1 keep-alive
    # request instead of nginx's default "Connection: close".
    proxy_set_header Connection        "";

    # Never advertise the framework (the app disables it too; belt and braces).
    proxy_hide_header X-Powered-By;

    # Fail fast when Node is down or hung. 60 s read covers the slowest honest
    # request (a judged submission: queue + compile + run).
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    60s;

    # Scanners ask for /.env, /.git/config and the like. Nothing is served from
    # disk here, so refuse any path with a dot-file segment at the door instead
    # of waking Node. (The ACME challenge lives on port 80 and is not affected;
    # /health below is an exact match and wins over this.)
    location ~ /\. {
        return 404;
    }

    # Liveness probe for uptime monitors and the deploy check. Exempt from rate
    # limits so a monitor can never be throttled into reporting an outage, and
    # not logged so it does not drown the access log. (/health/ready also
    # queries the database and Redis, so it deliberately stays rate limited in
    # the catch-all location below.)
    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:3000;
    }

    # Socket.IO: WebSocket upgrade plus its long-polling fallback. The limits on
    # this and the two locations below are a flood fuse sized for a whole lab
    # behind one address, not a user-facing limit (see 00-codecraft-http.conf).
    location /socket.io/ {
        limit_req  zone=cc_api burst=300 nodelay;
        limit_conn cc_conn 400;

        proxy_pass http://127.0.0.1:3000;

        # nginx only inherits proxy_set_header from the server level into a
        # location that sets NONE of its own. This location needs Upgrade and
        # Connection, so it must repeat the four headers above, or the backend
        # would silently lose its one trusted X-Forwarded-For hop.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # A WebSocket is idle between messages. Socket.IO pings every ~25 s
        # (plus ~20 s to answer), so anything above ~45 s keeps healthy sockets
        # alive; an hour is a generous ceiling that still frees dead ones.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Sign-in and token endpoints (Google OAuth redirect and callback, code
    # exchange, guest sessions, /auth/me): the stricter 10 r/s zone. The burst
    # absorbs a whole lab signing in at once; /auth/me alone is one request per
    # page load. The app's own per-IP limits on the anonymous routes are tighter.
    location /auth/ {
        limit_req  zone=cc_auth burst=100 nodelay;
        limit_conn cc_conn 400;

        proxy_pass http://127.0.0.1:3000;
    }

    # Everything else: the regular API.
    location / {
        limit_req  zone=cc_api burst=300 nodelay;
        limit_conn cc_conn 400;

        proxy_pass http://127.0.0.1:3000;
    }
}
