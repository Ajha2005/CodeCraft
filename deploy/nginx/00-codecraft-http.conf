# =============================================================================
# CodeCraft API: nginx settings that live at http{} level.
#
# Install as /etc/nginx/conf.d/00-codecraft-http.conf
#
# Ubuntu's nginx.conf includes conf.d/*.conf inside http{} BEFORE sites-enabled/,
# and the "00-" prefix keeps this file first, so the zones and the map defined
# here already exist when the server blocks in codecraft-api.conf use them.
# =============================================================================

# Do not announce the nginx version in the Server header or on error pages.
server_tokens off;

# ----- Rate limiting: shared-memory zones -------------------------------------
# Keyed on $binary_remote_addr, the client IP in binary form (4 bytes for IPv4,
# so 10 MB of zone holds roughly 160,000 addresses). The server file decides
# which location uses which zone and how much burst it tolerates.
#   cc_api   general API traffic: 100 requests/s per IP (bursts in the server file)
#   cc_auth  /auth/*: 10 requests/s per IP, with a burst big enough for a whole
#            lab signing in at once. The app's own per-IP limits on the anonymous
#            sign-in routes (10 to 30 a minute) are the precise ones.
#   cc_conn  requests/connections in flight per IP (long-lived WebSockets count)
#
# These are a flood fuse for one machine that sends thousands of requests a
# second, NOT the rate limit users should ever meet. The app limits precisely:
# a signed-in user is counted per account (AppThrottlerGuard), so a whole campus
# behind one NAT address does not share one budget. Nginx can only count per IP,
# so its numbers must sit far above what a full lab does together (every page
# load is about ten requests, and /auth/me comes with each).
#
# Three things to know when tuning:
#  - Behind Cloudflare, $remote_addr is Cloudflare's edge address unless
#    cloudflare-realip.conf is included, and then every visitor would share a
#    single bucket. See the header of that file.
#  - If a contest is held from one network with a few hundred people and users
#    see 429s that the backend did not produce, raise these numbers first.
#  - A 429 produced by nginx carries no CORS headers, so a browser reports it
#    as a network error. The backend's own throttler (JSON 429 with CORS
#    headers) is the user-friendly layer.
limit_req_zone  $binary_remote_addr  zone=cc_api:10m   rate=100r/s;
limit_req_zone  $binary_remote_addr  zone=cc_auth:10m  rate=10r/s;
limit_conn_zone $binary_remote_addr  zone=cc_conn:10m;

# Answer 429 (what the backend's throttler answers too); nginx's default is 503,
# which monitors and clients read as "server broken". Rejections are logged at
# "warn", which the default error_log level (error) leaves out; they still
# show up as 429s in the access log.
limit_req_status     429;
limit_conn_status    429;
limit_req_log_level  warn;
limit_conn_log_level warn;

# ----- WebSocket upgrade --------------------------------------------------------
# $connection_upgrade is "upgrade" when the client asks to switch protocols
# (Socket.IO's WebSocket transport) and "close" otherwise. It feeds the
# `Connection` header of the /socket.io/ location only.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ----- TLS session cache ------------------------------------------------------------
# Lets a returning visitor (a phone that reconnects) skip most of the handshake.
# It is set here, at http level, and not in the HTTPS server block, because nginx
# looks a session up before it knows which server the name belongs to: a cache set
# only in the real server's block would never be used. Ubuntu's nginx.conf sets
# none of these three, so there is no duplicate. Tickets stay off (their key never
# rotates until a reload). The protocols and ciphers are in codecraft-api.conf.
ssl_session_cache   shared:cc_tls:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# ----- Compression (tuning only) --------------------------------------------------
# `gzip on;` is deliberately NOT here. Ubuntu's stock nginx.conf already has it
# at http level, and nginx refuses a second `gzip` in the same context with
# "directive is duplicate" (even with the same value). codecraft-api.conf turns
# it on in its server block, which is allowed and takes precedence; the lines
# below are the settings that go with it.
# Responses the app already compressed (the backend uses the `compression`
# middleware) pass through untouched, because nginx never compresses a body
# that has a Content-Encoding.
gzip_comp_level 5;      # good size/CPU trade-off on 2 burstable vCPUs
gzip_min_length 1024;   # compressing tiny bodies costs CPU and saves nothing
gzip_vary       on;     # caches and CDNs keep the plain and gzip copies apart
gzip_proxied    any;    # also compress for proxied requests (Cloudflare, ...)
gzip_types      application/json text/plain application/javascript image/svg+xml;
