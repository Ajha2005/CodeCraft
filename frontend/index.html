<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071019" />
    <script>
      // Apply the saved theme before first paint (dark unless the player chose light).
      try {
        var t = localStorage.getItem('cc.theme.v1') === 'light' ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
        if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#e8f1f9');
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <title>CodeCraft</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
